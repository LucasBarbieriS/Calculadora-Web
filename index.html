<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="calculadora">

        <h1>Calculadora</h1>

        <div id="visor" class="visor">0</div>

        <section class="botoes">

            <button class="limpar" data-action="clear">C</button>
            <button data-action="backspace">⌫</button>
            <button data-action="sqrt">√</button>
            <button data-operator="/">÷</button>

            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button data-operator="*">×</button>

            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button data-operator="-">−</button>

            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button data-operator="+">+</button>

            <button data-action="invert">+/-</button>
            <button data-number="0">0</button>
            <button data-action="decimal">.</button>
            <button class="igual" data-action="equals">=</button>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
